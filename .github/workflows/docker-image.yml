name: Build, Dockerize, and Push to GitHub Container Registry

on:
  push:
    branches:
      - dev  # Adjust this to your default branch
  pull_request:

jobs:
  build-dockerize-push:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Set up Java and Maven
      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 3: Set up Docker Buildx (optional but recommended for multi-platform builds)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Step 4: Log in to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  # Uses GitHub token for authentication

      # Step 5: Build Docker image and push to GitHub Container Registry
      - name: Build and Push Docker Images to GHCR
        run: |
          # Iterate through directories
          for dir in $(find . -mindepth 1 -maxdepth 1 -type d); do
            if [ -f "$dir/pom.xml" ] && [ "$(basename $dir)" != "docker" ]; then
              echo "Found pom.xml in $dir. Running Maven package and Docker build..."

              # Navigate to directory and run Maven to build the Docker image
              (cd $dir && mvn package dockerfile:build)

              # Get the image name (using GHCR format: ghcr.io/OWNER/IMAGE_NAME:TAG)
              IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/$(basename $dir):latest"

              # Tag the Docker image (assuming the image name is 'latest')
              docker tag $(docker images -q $dir) $IMAGE_NAME

              # Push the Docker image to GitHub Container Registry
              docker push $IMAGE_NAME
            else
              echo "Skipping $dir (either no pom.xml or directory named 'docker')"
            fi
          done

