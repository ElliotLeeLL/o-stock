name: Build and Push Docker Images to GitHub Container Registry

on:
  push:
    branches:
      - dev  # Trigger on push to the main branch (adjust as needed)
  pull_request:
    branches:
      - dev  # Trigger on PRs targeting the main branch (adjust as needed)

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Set up Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 3: Set up Docker Buildx (optional but recommended for multi-platform builds)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Step 4: Logout of Docker (to clear any existing login)
      - name: Logout from Docker (if logged in)
        run: docker logout

      # Step 5: Log in to GitHub Container Registry (GHCR)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          username: ${{ github.actor }}  # GitHub username
          password: ${{ secrets.GITHUB_TOKEN }}  # GitHub token (automatically provided)
          registry: ghcr.io

      # Step 6: Build and push Docker images for each directory with a pom.xml
      - name: Build and Push Docker Images to GHCR
        run: |
          # Iterate through directories in the repository
          for dir in $(find . -mindepth 1 -maxdepth 1 -type d); do
            # Skip the 'docker' directory
            if [ "$(basename $dir)" == "docker" ]; then
              echo "Skipping directory: $dir"
              continue
            fi

            # Check if the directory contains a pom.xml file
            if [ -f "$dir/pom.xml" ]; then
              echo "Found pom.xml in $dir. Running Maven package and Docker build..."

              # Navigate to the directory and build the Docker image using Maven
              (cd $dir && mvn package dockerfile:build)

              # Tag the Docker image in GHCR format (ghcr.io/OWNER/IMAGE_NAME:latest)
              IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/$(basename $dir):latest"
              echo "IMAGE_NAME: $IMAGE_NAME"  # Output the target image name for debugging

              # Get the image ID (latest image created by the mvn command)
              IMAGE_ID=$(docker images -q $(basename $dir))
              # Check if IMAGE_ID is not empty
              if [ -z "$IMAGE_ID" ]; then
                echo "Error: Image ID is empty, the Docker image may not have been built."
                exit 1
              fi

              # Tag the built image with the GHCR repository and tag
              docker tag $IMAGE_ID $IMAGE_NAME

              # Push the image to GitHub Container Registry
              docker push $IMAGE_NAME
            else
              echo "Skipping $dir (no pom.xml found)"
            fi
          done
