name: Build and Push Docker Images to GHCR

on:
  push:
    branches:
      - dev  # Trigger on push to the main branch (adjust as needed)
  pull_request:
    branches:
      - dev  # Trigger on PRs targeting the main branch (adjust as needed)

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Set up Docker
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Step 3: Log in to GitHub Container Registry (GHCR)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io

      # Step 4: Build and Push Docker images for each directory with a Dockerfile
      - name: Build and Push Docker Images to GHCR
        run: |
          for dir in $(find . -mindepth 1 -maxdepth 1 -type d); do
            # Skip the 'docker' directory
            if [ "$(basename $dir)" == "docker" ]; then
              echo "Skipping directory: $dir"
              continue
            fi

            # Check if the directory contains a Dockerfile
            if [ -f "$dir/Dockerfile" ]; then
              echo "Found Dockerfile in $dir. Building Docker image..."

              # Convert the repository owner and directory name to lowercase
              OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
              DIR_NAME=$(basename $dir | tr '[:upper:]' '[:lower:]')

              # Create the full image name with lowercase OWNER and DIR_NAME
              IMAGE_NAME="ghcr.io/$OWNER/$DIR_NAME:latest"
              echo "Building image: $IMAGE_NAME"
              
              # Build Docker image
              docker build -t $IMAGE_NAME $dir

              # Push the image to GitHub Container Registry
              docker push $IMAGE_NAME
            else
              echo "Skipping $dir (no Dockerfile found)"
            fi
          done
